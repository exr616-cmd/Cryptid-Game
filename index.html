arrival:{area:"mercy",title:"The County Line",symbol:"☾",text:

radio:{area:"mercy",title:"The Voice Between Stations",symbol:"▣",text:

"Your father took this."

"One of the shadows belongs to a man who died twenty years before the photograph was taken."`,

function triggerRandomEncounter(){
  initProtagonist();
  if(Math.random()>0.28)return false;
  const list=RANDOM_ENCOUNTERS[S.loc]||[];
  if(!list.length)return false;
  const e=list[Math.floor(Math.random()*list.length)];
  const old=sceneId;
  const tempId="random_"+S.day+"_"+S.hour+"_"+Math.floor(Math.random()*9999);
  SCENES[tempId]={area:S.loc,title:"Something Along the Road",symbol:"?",text:e.text,choices:e.choices.map(x=>[x[0],x[1],{...x[2],next:old}])};
  sceneId=tempId;return true;
}
function startNPCArc(npc){
  const arr=NPC_ARCS[npc]||[];
  if(!arr.length)return;
  const available=arr.filter(x=>!S.flags["seen_"+x.id]);
  if(!available.length){log(npc+" has nothing new to say.");render();return;}
  const a=available[0];S.flags["seen_"+a.id]=true;
  SCENES["arc_"+a.id]={area:CHAR[npc]?.area||S.loc,title:a.title,symbol:"☷",text:a.text,choices:a.choices};
  sceneId="arc_"+a.id;render();
}
function startSideQuest(name){
  const q=SIDE_QUESTS[name];if(!q)return;
  S.quests[name]=S.quests[name]||{started:true,steps:[]};
  S.quests[name].started=true;
  log("Quest started: "+name);render();
}
function finishEligibleQuests(){
  for(const [name,q] of Object.entries(SIDE_QUESTS)){
    const st=S.quests[name];if(!st||st.done)continue;
    let ok=true;
    for(const step of q.steps){
      if(step==="photo"&&!S.flags.photo)ok=false;
      if(step==="watchtower"&&!S.flags.flatwoods_map)ok=false;
      if(step==="flatwoods"&&!S.flags.visitor_question&&!S.flags.kneel)ok=false;
      if(step==="agnes"&&!S.flags.agnes_rose_grave)ok=false;
      if(step==="grave"&&!S.flags.bell_rung&&!S.flags.bell_buried)ok=false;
      if(step==="jonah"&&!S.flags.jonah_radio)ok=false;
      if(step==="radio"&&!S.flags.heard_dead_frequency)ok=false;
      if(step==="eli"&&!S.flags.eli_cabin)ok=false;
      if(step==="cabin"&&!S.flags.eli_cabin)ok=false;
      if(step==="claire"&&!S.flags.observatory_witness&&!S.flags.observatory_closed)ok=false;
      if(step==="observatory"&&!S.flags.observatory_witness&&!S.flags.observatory_closed)ok=false;
      if(step==="boone"&&!S.flags.boone_rifle&&!S.flags.spared_yeti)ok=false;
      if(step==="pass"&&!S.flags.spared_yeti&&!S.flags.boone_rifle)ok=false;
    }
    if(ok&&!st.done){st.done=true;S.collectibles.push(q.reward);S.xp+=20;log("Quest completed: "+name+".")}
  }
}

function cryptidArcAvailable(id){
  return CRYPTID_ARCS[id] && CRYPTID_ARCS[id].some(x=>!S.flags["seen_"+x.id]);
}
function startCryptidArc(id){
  initProtagonist();
  const arr=CRYPTID_ARCS[id]||[];
  const a=arr.find(x=>!S.flags["seen_"+x.id]);
  if(!a){log("You have exhausted this thread—for now.");render();return;}
  S.flags["seen_"+a.id]=true;
  SCENES["cryptid_"+a.id]={area:a.area,title:a.title,symbol:a.symbol,text:a.text,choices:a.choices};
  sceneId="cryptid_"+a.id;render();
}
function unlockCryptidPanel(){
  const idByArea={pine:"bigfoot",wastes:"chupacabra",mercy:"goatman",flatwoods:"flatwoods",sky:"mothman",highway:"skinwalker",north:"wendigo"};

  return `<div class="panel"><h2>Investigation</h2><div class="small">The main phenomenon here has deeper layers than the first encounter.</div><button onclick="startCryptidArc('${id}')">${cryptidArcAvailable(id)?"Continue investigation":"Review field notes"}</button>${S.loc==="sky"?`<button onclick="startCryptidArc('ufo')">Investigate the Object</button>`:""}</div>`;
}

function initProtagonist(){
  if(!S.protagonist){
    S.protagonist={
      profile:"investigator",name:"Alex",age:34,occupation:"freelance investigator",
      history:"Your father disappeared twelve years ago after returning from Nocturne County.",
      traits:{curiosity:0,guilt:0,control:0,independence:0,avoidance:0,anger:0,faith:0,hope:0,fear:0,reason:0,detachment:0},
      memories:[],promises:[],lies:0,kindness:0,cruelty:0,violence:0,questions:0
    };
  }
  if(!S.world){S.world={weather:"cold rain",rumors:[],npcMood:{},activitiesDone:{},shopsUsed:0};}
  if(!S.world.rumors.length)S.world.rumors=[WORLD.rumors[Math.floor(Math.random()*WORLD.rumors.length)]];
}
function alterProtagonist(k,v=1){initProtagonist();S.protagonist.traits[k]=(S.protagonist.traits[k]||0)+v;}
function chooseProtagonistProfile(profile,name){
  initProtagonist();
  const p=PROFILES[profile]||PROFILES.investigator;
  S.protagonist.profile=profile;S.protagonist.name=(name||p.name).trim()||p.name;
  Object.entries(p.traits).forEach(([k,v])=>alterProtagonist(k,v));
  S.flags.protagonist_chosen=true;
  S.log.unshift("You chose who you believe you are.");
  sceneId="arrival";render();
}

  function weatherFor(s){

  function schedule(n,h){ for(const x of n.schedule){ if(h>=x[0]&&h<x[1])return x[2]; } return n.schedule[0]?.[2]||"unknown"; }
  function worldTick(s,reason){

  }
  function inspectEvidence(id){
    const s=S,v=ensure(s),e=EVIDENCE[id]; if(!e)return;

  }
  function buildBoard(){
    const s=S,v=ensure(s); return Object.entries(HYP).map(([id,h])=>{const n=v.hypotheses[id]||{support:[],contra:[]};return {id,title:h.title,support:n.support,contra:n.contra,ready:n.support.length>=2 && n.contra.length===0};});

    v.causal.push({type:"hypothesis",id,day:s.day,hour:s.hour});s.flags["hyp_"+id]=true;s.stats.truth=(s.stats.truth||0)+1;

    ensure(S);

  const MOMENTS=[{id:'m01',title:'Silent County',text:'The county goes silent for a second time. Every clock stops at 2:13. One voice remains on the emergency frequency—and it is yours.',choices:[{label:'You speak into the radio',effect:s=>{s.v15.flags.radioAnswered=true;s.v15.echoes.push('You answered a voice that has not happened yet.');}},{label:'You destroy the radio',effect:s=>{s.v15.flags.radioDestroyed=true;s.threat+=2;}},{label:'You wait',effect:s=>{s.v15.flags.silenceWaited=true;}}]},{id:'m02',title:'Name in the Margin',text:"Mara puts a catalog card on the table. Your father's name is written on the back in handwriting you recognize as your own.",choices:[{label:'Ask who wrote it',effect:s=>{s.v15.flags.askedMargin=true;s.stats.truth=(s.stats.truth||0)+1;}},{label:'Hide the card',effect:s=>{s.v15.flags.hiddenCard=true;s.stats.lies=(s.stats.lies||0)+1;}},{label:'Burn it',effect:s=>{s.v15.flags.burnedCard=true;s.stats.violence=(s.stats.violence||0)+1;}}]},{id:'m03',title:'The Second Bed',text:'The second bed is warm. There is an indentation in the pillow shaped like the side of your head.',choices:[{label:'Lie down',effect:s=>{s.v15.flags.sleptSecondBed=true;deepCond(s,'false_memory');}},{label:'Sleep on the floor',effect:s=>{s.v15.flags.floorChoice=true;}},{label:'Leave the room',effect:s=>{s.v15.flags.leftSecondBed=true;}}]},{id:'m04',title:'The Future Photograph',text:"The developed photograph shows tomorrow's weather and today's wound.",choices:[{label:'Take another photo',effect:s=>{s.v15.flags.futurePhoto=true;addEv(s,'impossible_photo');}},{label:'Cover the lens',effect:s=>{s.v15.flags.coveredLens=true;}},{label:'Destroy the negative',effect:s=>{s.v15.flags.destroyedNegative=true;}}]},{id:'m05',title:'The Road Choice',text:'The highway divides into two identical roads. One sign says HOME. The other says YOU ALREADY WENT THERE.',choices:[{label:'HOME',effect:s=>{s.v15.flags.roadHome=true;}},{label:'YOU ALREADY WENT THERE',effect:s=>{s.v15.flags.roadRep ,{id:'m11',title:'The Missing Hour',text:'You lose an hour. Your recorder contains a conversation you do not remember having.',choices:[{label:'Play it',effect:s=>{s.v15.flags.playedMissingHour=true;deepCond(s,'missing_time');}},{label:'Delete it',effect:s=>{s.v15.flags.deletedMissingHour=true;}},{label:'Give it to Jonah',effect:s=>{s.v15.flags.gaveToJonah=true;}}]},{id:'m12',title:"The Hunter's Rifle",text:"Ren's unloaded rifle is standing upright in fresh snow. The barrel is warm.",choices:[{label:'Take it',effect:s=>{s.v15.flags.tookRifle=true;}},{label:'Leave it',effect:s=>{s.v15.flags.leftRifle=true;}},{label:"Call Ren's name",effect:s=>{s.v15.flags.calledRen=true;}}]},{id:'m13',title:'The Mothman Threshold',text:'The telescope shows you standing in the observatory tomorrow, watching yourself tonight.',choices:[{label:'Turn around',effect:s=>{s.v15.flags.turnedMothman=true;s.threat+=3;}},{label:'Stay still',effect:s=>{s.v15.flags.stayedMothman=true;}},{label:'Break the telescope',effect:s=>{s.v15.flags.brokeTelescope=true;}}]},{id:'m14',title:"The Father's Room",text:'A motel room contains three photographs of your father. In each one, he is standing farther away from the camera.',choices:[{label:'Take them',effect:s=>{s.v15.flags.tookFatherPhotos=true;}},{label:'Leave them',effect:s=>{s.v15.flags.leftFatherPhotos=true;}},{label:'Arrange them',effect:s=>{s.v15.flags.arrangedPhotos=true;}}]},{id:'m15',title:'The Last Question',text:'At the county line, someone asks: If you knew the truth would hurt everyone, would you still want it?',choices:[{label:'Yes',effect:s=>{s.v15.flags.lastYes=true;s.stats.truth=(s.stats.truth||0)+2;}},{label:'No',effect:s=>{s.v15.flags.lastNo=true;s.stats.lies=(s.stats.lies||0)+1;}},{label:"I don't know",effect:s=>{s.v15.flags.lastUnknown=true;s.stats.reason=(s.stats.reason||0)+1;}}]}];

  const TRIGGERS=[
    s=>s.flags?.silent_county&&!s.v15.moments.m01,
    s=>(s.v14?.collisions&&Object.keys(s.v14.collisions).length>=1)&&!s.v15.moments.m02,
    s=>s.v12?.worldFlags?.warmBed&&!s.v15.moments.m03,
    s=>s.v12?.worldFlags?.photoFuture&&!s.v15.moments.m04,
    s=>s.v12?.worldFlags?.roadRepeat&&s.v12?.worldFlags?.emptyTruck&&!s.v15.moments.m05,
    s=>s.v12?.worldFlags?.table&&!s.v15.moments.m06,

  function tick(){
    const s=st(),v=ensure(s);
    for(let i=0;i<MOMENTS.length;i++){
      if(v.moments[MOMENTS[i].id])continue;
      let ok=false;try{ok=!!TRIGGERS[i](s)}catch(e){}
      if(ok&&!v.pending.includes(MOMENTS[i].id))v.pending.push(MOMENTS[i].id);
    }
  }
  function play(id,choice){
    const s=st(),v=ensure(s),m=MOMENTS.find(x=>x.id===id);if(!m)return;
    const c=m.choices[choice];if(!c)return;
    v.moments[id]={choice,at:Date.now(),day:s.day,hour:s.hour};
    v.pending=v.pending.filter(x=>x!==id);c.effect(s);
    v.history.push({type:'immense_moment',id,choice,day:s.day,hour:s.hour});
    v.echoes.push(m.title+' — '+c.label);s.log=s.log||[];s.log.push('IMMENSE MOMENT: '+m.title+' / '+c.label);
    try{render()}catch(e){}
  }
  function score(){
    const s=st(),v=ensure(s),stats=s.stats||{},conds=s.v11?.conditions||{};
    let x=(stats.truth||0)*3+(stats.mercy||0)*3+(stats.reason||0)*2+(stats.faith||0)*2+(stats.wild||0)*2-(stats.lies||0)*2-(stats.violence||0);
    x+=Object.keys(v.moments).length*7+v.history.length*2+Object.keys(s.v14?.collisions||{}).length*5+(s.collectibles?.length||0);
    x+=(conds.obsession||0)*2-(conds.numb||0)*2-(conds.distrust||0);
    return x;
  }
  function resolve(){
    const s=st(),v=ensure(s);if(v.ending)return v.ending;
    const seed=s.day*97+s.hour*31+score()*13+v.history.length*17+(s.collectibles?.length||0)*19;
    const e=ENDINGS[Math.abs(seed)%ENDINGS.length];
    v.ending={id:e.id,title:e.title,text:e.text,score:score(),at:Date.now(),history:v.history.slice(-12)};
    v.endingHistory.push(v.ending);v.resolved=true;s.flags=s.flags||{};
    s.flags.v15_ending=e.id;s.flags.v15_ending_title=e.title;s.log=s.log||[];s.log.push('LIFE RESOLVED: '+e.title);
    try{render()}catch(err){}return v.ending;
  }
  function clearEnding(){const s=st(),v=ensure(s);v.ending=null;v.resolved=false;s.flags.v15_ending=null;}
  window.NocturneV15={version:VERSION,moments:MOMENTS,endings:ENDINGS,tick,play,resolve,clearEnding,score,state:ensure};
  window.v15Play=play;window.v15Resolve=resolve;window.v15ResetEnding=clearEnding;
  const oldTravel=window.travel;if(oldTravel&&!oldTravel.__v15){window.travel=function(k){const r=oldTravel(k);tick();return r};window.travel.__v15=true;}
  const oldChoose=window.choose;if(oldChoose&&!oldChoose.__v15){window.choose=function(i){const r=oldChoose(i);tick();return r};window.choose.__v15=true;}
  const oldAttack=window.attack;if(oldAttack&&!oldAttack.__v15){window.attack=function(k){const r=oldAttack(k);tick();return r};window.attack.__v15=true;}
  const oldSave=window.save;if(oldSave&&!oldSave.__v15){window.save=function(){ensure(st()).savedAt=Date.now();const r=oldSave();tick();return r};window.save.__v15=true;}
  tick();
  const oldRender=window.render;
  if(oldRender&&!oldRender.__v15){
    window.render=function(){

    count(){
      const st=state();
      return ['log','clues','collectibles','visited','relationships','conditions','injuries'].reduce((n,k)=>{
        const v=st[k]; return n+(Array.isArray(v)?v.length:(v&&typeof v==='object'?Object.keys(v).length:0));
      },0);
    },
    fingerprint(){
      const st=state();
      const payload={day:st.day,hour:st.hour,location:st.location,threat:st.threat,stats:st.stats,flags:st.flags,log:st.log,conditions:st.conditions,injuries:st.injuries};
      let h=2166136261;
      for(const c of JSON.stringify(payload)) h=Math.imul(h^c.charCodeAt(0),16777619);
      return (h>>>0).toString(16).padStart(8,'0');
    }
  };
  U.endings={
    resolve(){
      const st=state(), f=st.flags||{}, stats=st.stats||{}, clues=arr('clues'), log=arr('log');
      const candidates=[
        ['The County Remembers', clues.length+log.length+(+st.threat||0)],
        ['The Truth You Could Carry', (+stats.truth||0)*4+(f.fatherTape?8:0)],
        ['What You Refused to Know', (+stats.avoidance||0)*4+(f.refusedInvestigation?7:0)],
        ['A Door Left Open', (+stats.reason||0)+(+stats.faith||0)+(f.archiveDoor?8:0)],
        ['The Last Road Home', (+stats.mercy||0)+(f.roadChoice?6:0)],
        ['The Shape in the Snow', (+stats.wild||0)+(f.whiteSilence?7:0)],
        ['The Future Looking Back', (f.mothmanFuture?10:0)+(f.futurePhotograph?8:0)],
        ['The Life You Made Here', this.historyWeight()]
      ];
      candidates.sort((a,b)=>b[1]-a[1]);
      return {title:candidates[0][0],history:this.historyWeight(),fingerprint:U.history.fingerprint(),alternatives:candidates.slice(1,4)};
    },
    historyWeight(){return U.history.count()+score()+(+((state().threat)||0))}
  };
  U.legacy={
    export(){
      const st=state();
      return {version:U.version,fingerprint:U.history.fingerprint(),ending:U.endings.resolve(),flags:st.flags||{},stats:st.stats||{},conditions:st.conditions||[],log:arr('log').slice(-40)};
    },
    markComplete(){addFlag('lifeComplete',true); addFlag('legacyUnlocked',true); pushLog('A life was completed and entered into the county record.');}
  };
  U.integration={
    tick(){
      const st=state();
      if((+st.threat||0)>=8) addFlag('countyWatchful',true);
      if((+st.hour||0)>=23 && (+st.threat||0)>=6) addFlag('lateNightPressure',true);
      if(arr('conditions').includes('nightmares')) addFlag('sleepIsUnsafe',true);
      if(arr('injuries').length) addFlag('bodyCarriesHistory',true);
      pushLog('The county remembers what this life has changed.');
    },
    snapshot(){return {fingerprint:U.history.fingerprint(),ending:U.endings.resolve(),integrity:U.integrity}}
  };
  U.ui={
    panel(){
      if(document.getElementById('v25-panel')) return;
      const d=document.createElement('div'); d.id='v25-panel';
      d.style.cssText='position:fixed;right:14px;bottom:14px;z-index:9999;background:rgba(8,8,12,.94);color:#eee;border:1px solid #666;padding:12px;border-radius:8px;font:12px/1.4 system-ui;max-width:260px;box-shadow:0 8px 30px #0008';
      d.innerHTML='<b>THE COUNTY REMEMBERS</b><div id="v25-life"></div><button id="v25-resolve">Resolve This Life</button> <button id="v25-export">Legacy</button>';
      root.appendChild(d);
      const render=()=>{const e=U.endings.resolve(); document.getElementById('v25-life').textContent=e.title+' · '+e.fingerprint+' · history '+e.history;};
      d.querySelector('#v25-resolve').onclick=()=>{U.legacy.markComplete();render(); alert('Life recorded: '+U.endings.resolve().title);};
      d.querySelector('#v25-export').onclick=()=>{console.log('NOCTURNE LEGACY',U.legacy.export()); alert('Legacy record written to the browser console.');};
      render();
    }
  };
  U.boot=function(){U.integration.tick(); U.ui.panel();};
  window.addEventListener('load',()=>setTimeout(U.boot,120));
  U.boot();
})();
</script>

<script>

(function(){
  'use strict';
  const VERSION='V27.0';
  const requiredFns=[
    'render','save','travel','use','startCryptidArc','startNPCArc','startSideQuest',
    'v11Investigate','v11Stealth','v11Talk','v12Choice','v12Refuse','v13Play',
    'v15Play','v15Resolve','v16Tick','nocturneV5FindEvidence','nocturneV5CombineEvidence',

    'nocturneV8Action','nocturneV9AdvanceCampaign','nocturneV22Promise','nocturneV22Tell',
    'nocturneV23Resolve','nocturneV23Pulse'
  ];
  const requiredObjects=['state','NOCTURNE_V26','nocturneV23'];
  const cryptids=['Bigfoot','Chupacabra','Goatman','Flatwoods Monster','UFO','Skinwalker','Wendigo','Yeti','Mothman'];
  function test(name,fn){try{return {name,ok:!!fn(),detail:''}}catch(e){return {name,ok:false,detail:String(e&&e.message||e)}}}
  function run(){
    const results=[];
    requiredObjects.forEach(k=>results.push(test('Object: '+k,()=>k in window && window[k]!=null)));
    requiredFns.forEach(k=>results.push(test('Function: '+k,()=>typeof window[k]==='function')));
    results.push(test('Cryptid registry: 9 required phenomena',()=>cryptids.length===9));
    results.push(test('State has core history containers',()=>window.state && typeof state==='object' && ['flags','inventory','clues','relationships','log'].every(k=>k in state)));
    results.push(test('LocalStorage available',()=>{const k='__nocturne_v27_probe';localStorage.setItem(k,'1');const ok=localStorage.getItem(k)==='1';localStorage.removeItem(k);return ok;}));
    results.push(test('JSON state serializes',()=>{const s=JSON.stringify(window.state); return s.length>20;}));
    results.push(test('Renderer exists',()=>typeof window.render==='function'));
    const passed=results.filter(x=>x.ok).length;
    return {version:VERSION,passed,total:results.length,results,timestamp:new Date().toISOString()};
  }
  window.nocturneV27={version:VERSION,run,results:null};
  window.nocturneV27Run=function(){const r=run();window.nocturneV27.results=r;return r;};
  function mount(){
    if(!location.search.includes('qa=1')) return;
    const box=document.createElement('div');
    box.id='nocturne-v27-qa';
    box.style.cssText='position:fixed;right:14px;bottom:14px;z-index:99999;background:#0b0b0f;color:#eee;border:1px solid #555;border-radius:10px;padding:12px;width:min(420px,calc(100vw - 28px));font:12px/1.45 system-ui;box-shadow:0 10px 40px #000';
    const title=document.createElement('div'); title.textContent='NOCTURNE V27 • PLAYTHROUGH QA'; title.style.fontWeight='700'; title.style.marginBottom='8px';
    const out=document.createElement('pre'); out.style.cssText='max-height:260px;overflow:auto;white-space:pre-wrap;margin:8px 0';
    const btn=document.createElement('button'); btn.textContent='Run integrity smoke test'; btn.style.cssText='padding:7px 10px;border-radius:6px;border:1px solid #777;background:#181820;color:#fff;cursor:pointer';
    btn.onclick=()=>{const r=window.nocturneV27Run();out.textContent=`${r.passed}/${r.total} checks passed\n`+r.results.map(x=>(x.ok?'✓ ':'✗ ')+x.name+(x.detail?' — '+x.detail:'')).join('\n');};
    box.append(title,btn,out);document.body.appendChild(box);
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',mount); else mount();
})();

<script id="v33-clean-ui-script">
(() => {
  const badIds=['v22-button','v22-rel','v25-panel','nocturne-v27-qa'];
  const badHeadings=[
    'Integration Layer','Equipment','Evidence Board','Catalogued Evidence',
    'Living County','THE COUNTY REMEMBERS','HISTORY COLLISION','HISTORY COLLISIONS',
    'CAUSAL CHAINS','DEEP COUNTY','CONDITION / PSYCHOLOGY'
  ];

  function cleanLegacy(){
    badIds.forEach(id=>document.getElementById(id)?.remove());

    // Remove every legacy integration panel that was appended into the main story.
    const scene=document.getElementById('scene');
    if(scene){
      [...scene.querySelectorAll('.panel')].forEach(p=>p.remove());
    }

    // Remove old floating/reminder widgets even if they were given a generated id.
    [...document.body.children].forEach(el=>{
      if(el===document.getElementById('app') || el.classList.contains('v33-nav') || el.classList.contains('v33-panel')) return;
      const text=(el.textContent||'').trim();
      if(text.includes('THE COUNTY REMEMBERS') || text.includes('PLAYTHROUGH QA')) el.remove();
    });
  }

  function panelHTML(which){
    const left=document.querySelector('.layout>.left');
    const right=document.querySelector('.layout>.right');
    if(which==='pack') return left?.innerHTML || '<div class="small">Your field pack is empty.</div>';
    if(which==='map'){
      const p=[...(right?.querySelectorAll('.panel')||[])].find(x=>(x.querySelector('h2')?.textContent||'').trim()==='Map');
      return p?.outerHTML || '<div class="small">The county map is unavailable.</div>';
    }
    if(which==='people'){
      const p=[...(right?.querySelectorAll('.panel')||[])].find(x=>(x.querySelector('h2')?.textContent||'').trim()==='People');
      return p?.outerHTML || '<div class="small">No one is currently visible.</div>';
    }
    if(which==='journal'){
      const wanted=['Objectives','Field Log','Side Work','Evidence','Local Life','You'];
      const ps=[...(right?.querySelectorAll('.panel')||[])].filter(x=>wanted.includes((x.querySelector('h2')?.textContent||'').trim()));
      return ps.map(x=>x.outerHTML).join('') || '<div class="small">Your journal is empty.</div>';
    }
    return '';
  }

  function buildPanels(){
    document.querySelectorAll('.v33-panel,.v33-nav').forEach(x=>x.remove());

    const nav=document.createElement('nav');
    nav.className='v33-nav';
    nav.innerHTML=`
      <button onclick="V33.act()"><span class="ico">✦</span><span class="lbl">Act</span></button>
      <button onclick="V33.open('pack')"><span class="ico">▣</span><span class="lbl">Pack</span></button>
      <button onclick="V33.open('map')"><span class="ico">⌖</span><span class="lbl">Map</span></button>
      <button onclick="V33.open('people')"><span class="ico">♙</span><span class="lbl">People</span></button>
      <button onclick="V33.open('journal')"><span class="ico">▤</span><span class="lbl">Journal</span></button>`;
    document.body.appendChild(nav);

    for(const type of ['pack','map','people','journal']){
      const names={pack:'Field Pack',map:'County Map',people:'People',journal:'Journal'};
      const p=document.createElement('section');
      p.className='v33-panel';p.id='v33-'+type;
      p.innerHTML=`<div class="v33-head"><h2>${names[type]}</h2><button class="v33-close" onclick="V33.close()">Close</button></div><div class="v33-body">${panelHTML(type)}</div>`;
      document.body.appendChild(p);
    }
  }

  function refresh(){
    cleanLegacy();
    buildPanels();
  }

  function open(type){
    refresh();
    document.getElementById('v33-'+type)?.classList.add('open');
  }
  function close(){document.querySelectorAll('.v33-panel').forEach(x=>x.classList.remove('open'))}
  function act(){
    close();
    const first=document.querySelector('#scene>.choices .choice');
    if(first){first.scrollIntoView({block:'center',behavior:'smooth'});}
  }

  window.V33={open,close,act,refresh};

  const base=window.render;
  if(typeof base==='function' && !base.__v33){
    const wrapped=function(){
      const result=base.apply(this,arguments);
      setTimeout(refresh,0);
      return result;
    };
    wrapped.__v33=true;
    window.render=wrapped;
    setTimeout(()=>{try{window.render()}catch(e){console.error(e)}},0);
  } else {
    setTimeout(refresh,0);
  }
})();
</script>
